<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 738" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Trial Design Workflow — from protocol to a reviewable TS draft</title>
  <desc id="workflow-desc">Target workflow for statistical programmers. An authorized protocol supplies page evidence to Step 1, Extract Study Facts, currently in development. The approved Step 0 Master Lookup supplies applicability rules to Step 2, Select parameters, and value and terminology rules to Step 3, Map and generate TS records. Step 4 performs QC and Excel review. Steps 2 through 4 are planned. Missing, conflicting and externally sourced information stays visible for programmer review throughout. AI proposes facts; versioned rules select and map; programmers review the result.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f3f8f6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#7c90a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="rule-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#3e8a74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; fill: #526b80; }
      .title { font-size: 30px; font-weight: 700; letter-spacing: -.6px; fill: #152f44; }
      .sub { font-size: 17px; fill: #496277; }
      .stage-title { font-size: 23px; font-weight: 650; fill: #18374c; letter-spacing: -.4px; }
      .body { font-size: 16px; fill: #4b6377; }
      .badge { font-size: 11px; font-weight: 700; letter-spacing: .8px; }
      .connector { fill: none; stroke: #93a6b7; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .rule { stroke: #76a895; marker-end: url(#rule-arrow); }
      .motion { pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="736" rx="22" fill="url(#canvas)" stroke="#dce5ed"/>
  <text x="44" y="42" class="eyebrow">TRIAL DESIGN / TS WORKFLOW</text>
  <text x="1076" y="42" text-anchor="end" class="eyebrow">TS ONLY · SDTMIG 3.4</text>
  <text x="44" y="87" class="title">From protocol to a reviewable TS draft</text>
  <text x="44" y="118" class="sub">The full workflow we are building, with evidence and programmer review throughout.</text>

  <!-- Inputs: the protocol feeds extraction; the lookup feeds selection and mapping. -->
  <g>
    <rect x="44" y="155" width="234" height="112" rx="14" fill="#fff" stroke="#cad8e4"/>
    <path d="M67 178 H85 L94 187 V211 H67 Z M85 178 V187 H94 M73 195 H87 M73 202 H84" fill="none" stroke="#4e718b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="190" class="stage-title" style="font-size:21px">Protocol PDF</text>
    <text x="66" y="240" class="body">Authorized study source</text>
  </g>
  <g>
    <rect x="310" y="155" width="766" height="112" rx="14" fill="#eaf5ef" stroke="#b9d8ca"/>
    <rect x="332" y="175" width="67" height="23" rx="11.5" fill="#d0e8db"/>
    <text x="365.5" y="190.5" text-anchor="middle" class="badge" fill="#235e47">STEP 0</text>
    <text x="414" y="193" class="stage-title">Master Lookup</text>
    <rect x="932" y="175" width="122" height="25" rx="12.5" fill="#d0e8db"/>
    <path d="M945 187 L949 191 L956 183" fill="none" stroke="#1a684d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1002" y="191.5" text-anchor="middle" class="badge" fill="#235e47">APPROVED V3</text>
    <text x="332" y="239" class="body">Parameter definitions · applicability · value sources · terminology · exceptions</text>
  </g>

  <path d="M161 267 V327" class="connector"/>
  <path d="M427 267 V327" class="connector rule"/>
  <path d="M693 267 V327" class="connector rule"/>
  <text x="161" y="304" text-anchor="middle" style="font-size:13px;fill:#526b80" paint-order="stroke" stroke="#f7faff" stroke-width="8">Page evidence</text>
  <text x="427" y="304" text-anchor="middle" style="font-size:13px;fill:#326b57" paint-order="stroke" stroke="#f7faff" stroke-width="8">Applicability rules</text>
  <text x="693" y="304" text-anchor="middle" style="font-size:13px;fill:#326b57" paint-order="stroke" stroke="#f7faff" stroke-width="8">Value &amp; terminology rules</text>

  <!-- All labels and routes remain visible when animation is unavailable. -->
  <path d="M278 415 H307" class="connector"/>
  <path d="M544 415 H573" class="connector"/>
  <path d="M810 415 H839" class="connector"/>

  <g>
    <rect x="44" y="330" width="234" height="174" rx="16" fill="#fff" stroke="#6f96cf" stroke-width="1.5"/>
    <circle cx="75" cy="361" r="14" fill="#e7effc"/>
    <text x="75" y="366" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#315da3">1</text>
    <text x="66" y="402" class="stage-title">Extract</text>
    <text x="66" y="430" class="stage-title">Study Facts</text>
    <text x="66" y="458" class="body">Facts + page evidence</text>
    <rect x="66" y="475" width="119" height="19" rx="9.5" fill="#e8effc"/>
    <text x="125.5" y="488" text-anchor="middle" class="badge" fill="#315da3">DEVELOPMENT</text>
  </g>
  <g>
    <rect x="310" y="330" width="234" height="174" rx="16" fill="#fbfcfd" stroke="#b9c8d4" stroke-dasharray="5 4"/>
    <circle cx="341" cy="361" r="14" fill="#eaf0f5"/>
    <text x="341" y="366" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#526b80">2</text>
    <text x="332" y="402" class="stage-title">Select</text>
    <text x="332" y="430" class="stage-title">parameters</text>
    <text x="332" y="458" class="body">Decisions + rationale</text>
    <rect x="332" y="475" width="83" height="19" rx="9.5" fill="#eaf0f5"/>
    <text x="373.5" y="488" text-anchor="middle" class="badge" fill="#526b80">PLANNED</text>
  </g>
  <g>
    <rect x="576" y="330" width="234" height="174" rx="16" fill="#fbfcfd" stroke="#b9c8d4" stroke-dasharray="5 4"/>
    <circle cx="607" cy="361" r="14" fill="#eaf0f5"/>
    <text x="607" y="366" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#526b80">3</text>
    <text x="598" y="402" class="stage-title">Map &amp; generate</text>
    <text x="598" y="430" class="stage-title">TS records</text>
    <text x="598" y="458" class="body">Use versioned value rules</text>
    <rect x="598" y="475" width="83" height="19" rx="9.5" fill="#eaf0f5"/>
    <text x="639.5" y="488" text-anchor="middle" class="badge" fill="#526b80">PLANNED</text>
  </g>
  <g>
    <rect x="842" y="330" width="234" height="174" rx="16" fill="#fbfcfd" stroke="#b9c8d4" stroke-dasharray="5 4"/>
    <circle cx="873" cy="361" r="14" fill="#eaf0f5"/>
    <text x="873" y="366" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#526b80">4</text>
    <text x="864" y="402" class="stage-title">QC &amp; review</text>
    <text x="864" y="430" class="stage-title">in Excel</text>
    <text x="864" y="458" class="body">TS draft + traceability</text>
    <rect x="864" y="475" width="83" height="19" rx="9.5" fill="#eaf0f5"/>
    <text x="905.5" y="488" text-anchor="middle" class="badge" fill="#526b80">PLANNED</text>
  </g>

  <!-- Small evidence markers illustrate direction; they never hide stage labels. -->
  <g class="motion" aria-hidden="true" fill="#356cba">
    <circle r="3" opacity="0">
      <animateMotion path="M161 270 V325" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" opacity="0" fill="#2a8062">
      <animateMotion path="M427 270 V325" begin=".7s" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" begin=".7s" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" opacity="0" fill="#2a8062">
      <animateMotion path="M693 270 V325" begin="1.4s" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" begin="1.4s" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M161 504 V527 H959 V504 M560 527 V548" fill="none" stroke="#a8b7c6" stroke-width="1.5" stroke-dasharray="4 5" stroke-linecap="round"/>
  <path d="M427 504 V527 M693 504 V527" fill="none" stroke="#a8b7c6" stroke-width="1.5" stroke-dasharray="4 5"/>
  <g>
    <rect x="44" y="550" width="1032" height="104" rx="14" fill="#edf1f8" stroke="#d5dfeb"/>
    <text x="66" y="577" class="eyebrow" style="fill:#3c577c">PROGRAMMER REVIEW THROUGHOUT</text>
    <text x="66" y="607" style="font-size:20px;font-weight:600;fill:#243e5c">Missing, conflicting or externally sourced information stays visible.</text>
    <text x="66" y="634" class="body">Check the evidence. Add study-specific context. Review the proposed result.</text>
  </g>
  <text x="44" y="691" style="font-size:16px;font-weight:600;fill:#24485e">AI proposes facts. Versioned rules select and map. Programmers review.</text>
  <text x="44" y="715" style="font-size:13px;fill:#526b80">Current delivery: Step 0 approved · Step 1 development · Steps 2–4 planned</text>
</svg>

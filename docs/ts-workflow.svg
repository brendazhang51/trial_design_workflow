<svg viewBox="0 0 1600 1050" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted SDTM Trial Summary workflow</title>
  <desc id="desc">An animated workflow diagram showing how a study protocol becomes evidence-backed study facts, auditable parameter decisions, a human-reviewed TS draft, and quality-control artifacts.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1d2e"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46d9c5"/>
      <stop offset="0.52" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#9c7cff"/>
    </linearGradient>
    <linearGradient id="outputFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162f4a"/>
      <stop offset="1" stop-color="#11243a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020711" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7894"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46d9c5"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.2px; fill: #46d9c5; }
      .title { font-size: 42px; font-weight: 750; letter-spacing: -1.2px; fill: #f4f8fc; }
      .subtitle { font-size: 18px; fill: #a9bdd1; }
      .card { fill: #10253a; stroke: #29445e; stroke-width: 1.4; filter: url(#shadow); }
      .card-title { font-size: 20px; font-weight: 700; fill: #f3f7fb; }
      .card-copy { font-size: 14px; fill: #9fb4c8; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; fill: #7f9ab3; }
      .number { font-size: 14px; font-weight: 800; fill: #061421; text-anchor: middle; dominant-baseline: middle; }
      .connector { fill: none; stroke: #5f7894; stroke-width: 2.4; marker-end: url(#arrow); stroke-linecap: round; }
      .connector-accent { fill: none; stroke: #46d9c5; stroke-width: 2.8; marker-end: url(#arrowAccent); stroke-linecap: round; }
      .connector-dashed { fill: none; stroke: #617b94; stroke-width: 1.8; stroke-dasharray: 7 8; marker-end: url(#arrow); }
      .pill { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .stage { opacity: 1; animation: rise .65s cubic-bezier(.2,.8,.2,1) forwards; }
      .s1 { animation-delay: .1s; } .s2 { animation-delay: .28s; } .s3 { animation-delay: .46s; }
      .s4 { animation-delay: .64s; } .s5 { animation-delay: .82s; } .s6 { animation-delay: 1s; }
      .draw { stroke-dasharray: 340; stroke-dashoffset: 0; animation: draw 1.1s ease-out forwards; }
      .d1 { animation-delay: .55s; } .d2 { animation-delay: .75s; } .d3 { animation-delay: .95s; }
      .d4 { animation-delay: 1.15s; } .d5 { animation-delay: 1.35s; }
      .gate-glow { animation: breathe 2.6s ease-in-out infinite; transform-origin: 1105px 357px; }
      .flow-dot { filter: url(#softGlow); }
      .output-card { animation: float 5s ease-in-out infinite; }
      .output-card:nth-of-type(2) { animation-delay: -.8s; }
      .output-card:nth-of-type(3) { animation-delay: -1.6s; }
      .output-card:nth-of-type(4) { animation-delay: -2.4s; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
      @keyframes breathe { 0%,100% { opacity: .35; transform: scale(.96); } 50% { opacity: .85; transform: scale(1.05); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) {
        .stage, .draw, .gate-glow, .output-card { animation: none !important; opacity: 1; stroke-dashoffset: 0; }
        animateMotion, animate { display: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>
  <circle cx="1400" cy="-40" r="330" fill="#315b92" opacity="0.08"/>
  <circle cx="100" cy="970" r="300" fill="#28bda8" opacity="0.06"/>
  <path d="M 0 180 C 400 130 730 220 1040 165 S 1440 120 1600 165" fill="none" stroke="#b8d0e5" stroke-opacity="0.045" stroke-width="2"/>

  <!-- Header -->
  <g class="stage s1">
    <text x="72" y="68" class="eyebrow">TRIAL DESIGN WORKFLOW · MVP V0.1</text>
    <text x="72" y="122" class="title">Protocol → Auditable SDTM TS Draft</text>
    <text x="72" y="158" class="subtitle">AI interprets meaning. Versioned rules and deterministic code control the data.</text>
    <rect x="1250" y="67" width="278" height="66" rx="16" fill="#0d2135" stroke="#29445e"/>
    <circle cx="1280" cy="100" r="9" fill="#46d9c5"/>
    <text x="1301" y="96" class="card-copy" style="font-weight:700;fill:#dce8f2">Human-in-the-loop</text>
    <text x="1301" y="116" class="mono">review before verified output</text>
  </g>

  <!-- Primary connectors -->
  <path class="connector draw d1" d="M 316 357 H 362"/>
  <path class="connector draw d2" d="M 622 357 H 668"/>
  <path class="connector draw d3" d="M 928 357 H 974"/>
  <path class="connector-accent draw d4" d="M 1236 357 H 1282"/>

  <!-- Moving signal dots -->
  <circle r="4.5" fill="#46d9c5" class="flow-dot">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 316 357 H 362 M 622 357 H 668 M 928 357 H 974 M 1236 357 H 1282"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Stage 1: Protocol -->
  <g class="stage s1">
    <rect x="72" y="244" width="244" height="226" rx="24" class="card"/>
    <circle cx="108" cy="281" r="18" fill="#46d9c5"/>
    <text x="108" y="281" class="number">1</text>
    <path d="M 104 320 h52 l20 20 v70 h-72 z" fill="#173a4b" stroke="#46d9c5" stroke-width="2"/>
    <path d="M 156 320 v20 h20" fill="none" stroke="#46d9c5" stroke-width="2"/>
    <path d="M 117 356 h46 M 117 370 h46 M 117 384 h31" stroke="#7ee8d8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <text x="196" y="337" class="card-title" style="font-size:18px">Protocol PDF</text>
    <text x="196" y="364" class="card-copy">Study design</text>
    <text x="196" y="386" class="card-copy">Objectives</text>
    <text x="104" y="416" class="card-copy">Treatments · eligibility</text>
    <rect x="98" y="431" width="192" height="26" rx="13" fill="#0b1b2a"/>
    <text x="194" y="445" class="pill" fill="#8ea8bf">SHA-256 fingerprinted</text>
  </g>

  <!-- Stage 2: Extraction -->
  <g class="stage s2">
    <rect x="362" y="244" width="260" height="226" rx="24" class="card"/>
    <circle cx="398" cy="281" r="18" fill="#65b5ff"/>
    <text x="398" y="281" class="number">2</text>
    <text x="390" y="329" class="card-title">Protocol Extractor</text>
    <text x="390" y="357" class="card-copy">LLM proposes structured facts</text>
    <g transform="translate(390 379)">
      <rect width="204" height="23" rx="6" fill="#132f49"/>
      <circle cx="13" cy="11.5" r="4" fill="#65b5ff"/>
      <text x="26" y="16" class="mono">value + source_page</text>
      <rect y="30" width="204" height="23" rx="6" fill="#132f49"/>
      <circle cx="13" cy="41.5" r="4" fill="#65b5ff"/>
      <text x="26" y="46" class="mono">quote + review_status</text>
    </g>
    <text x="390" y="449" class="mono">study_facts.json</text>
  </g>

  <!-- Stage 3: Selection -->
  <g class="stage s3">
    <rect x="668" y="244" width="260" height="226" rx="24" class="card"/>
    <circle cx="704" cy="281" r="18" fill="#9c7cff"/>
    <text x="704" y="281" class="number">3</text>
    <text x="696" y="329" class="card-title">Parameter Selector</text>
    <text x="696" y="357" class="card-copy">Evaluate every candidate TSPARMCD</text>
    <rect x="696" y="378" width="90" height="27" rx="13.5" fill="#173e3a"/>
    <text x="741" y="392" class="pill" fill="#6de0c9">INCLUDE</text>
    <rect x="794" y="378" width="106" height="27" rx="13.5" fill="#3a304e"/>
    <text x="847" y="392" class="pill" fill="#c2a9ff">REVIEW</text>
    <rect x="696" y="413" width="90" height="27" rx="13.5" fill="#29384a"/>
    <text x="741" y="427" class="pill" fill="#9db0c2">EXCLUDE</text>
    <rect x="794" y="413" width="106" height="27" rx="13.5" fill="#4a3623"/>
    <text x="847" y="427" class="pill" fill="#ffc671">EXTERNAL</text>
  </g>

  <!-- Stage 4: Review gate -->
  <g class="stage s4">
    <circle cx="1105" cy="357" r="126" fill="#f6a84a" opacity="0.12" class="gate-glow"/>
    <rect x="974" y="244" width="262" height="226" rx="24" fill="#162b3d" stroke="#d79543" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="1010" cy="281" r="18" fill="#f6a84a"/>
    <text x="1010" y="281" class="number">4</text>
    <text x="1002" y="329" class="card-title">Clinical Review Gate</text>
    <text x="1002" y="357" class="card-copy">Approve · correct · request source</text>
    <path d="M 1008 393 l13 13 28-31" fill="none" stroke="#72dec9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1062" y="397" class="card-copy" style="fill:#dbe7f1">Only approved facts pass</text>
    <rect x="1002" y="421" width="206" height="28" rx="14" fill="#3f3022"/>
    <text x="1105" y="436" class="pill" fill="#ffc671">ambiguity stays visible</text>
  </g>

  <!-- Stage 5: Generation -->
  <g class="stage s5">
    <rect x="1282" y="244" width="246" height="226" rx="24" class="card"/>
    <circle cx="1318" cy="281" r="18" fill="#46d9c5"/>
    <text x="1318" y="281" class="number">5</text>
    <text x="1310" y="329" class="card-title">TS Generator</text>
    <text x="1310" y="357" class="card-copy">Deterministic Python logic</text>
    <path d="M 1312 385 h42 l11 11 h78 v45 h-131 z" fill="#153b42" stroke="#46d9c5"/>
    <path d="M 1330 407 h96 M 1330 421 h96" stroke="#7ee8d8" stroke-width="2" opacity="0.7"/>
    <text x="1310" y="459" class="mono">CT mapping · TSSEQ · Excel</text>
  </g>

  <!-- Standards rail -->
  <g class="stage s3">
    <rect x="258" y="537" width="940" height="102" rx="22" fill="#0c1e30" stroke="#29445e"/>
    <text x="287" y="570" class="eyebrow" style="font-size:12px">VERSION-CONTROLLED KNOWLEDGE LAYER</text>
    <g transform="translate(287 587)">
      <rect width="180" height="30" rx="15" fill="#142d45"/><text x="90" y="16" class="pill" fill="#b7c9d9">SDTMIG v3.4 + errata</text>
      <rect x="194" width="175" height="30" rx="15" fill="#142d45"/><text x="281.5" y="16" class="pill" fill="#b7c9d9">Pinned NCI CT release</text>
      <rect x="383" width="178" height="30" rx="15" fill="#142d45"/><text x="472" y="16" class="pill" fill="#b7c9d9">Parameter Registry</text>
      <rect x="575" width="160" height="30" rx="15" fill="#142d45"/><text x="655" y="16" class="pill" fill="#b7c9d9">Applicability Rules</text>
      <rect x="749" width="160" height="30" rx="15" fill="#142d45"/><text x="829" y="16" class="pill" fill="#b7c9d9">Sponsor Template</text>
    </g>
    <path d="M 798 537 V 486" class="connector-dashed"/>
    <path d="M 1160 537 C 1260 516 1384 514 1404 486" class="connector-dashed"/>
  </g>

  <!-- Review loop -->
  <path d="M 1104 470 C 1098 516 1010 520 940 493 C 894 475 853 480 826 505" class="connector-dashed draw d5"/>
  <text x="842" y="524" class="mono" style="fill:#f4bd75">review / correct · preserve audit trail</text>

  <!-- QC stage -->
  <g class="stage s6">
    <path d="M 1405 470 V 574 C 1405 662 1292 681 1205 681 H 1137" class="connector-accent"/>
    <rect x="828" y="658" width="309" height="132" rx="24" fill="#133442" stroke="#46d9c5" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="866" cy="697" r="18" fill="#46d9c5"/>
    <text x="866" y="697" class="number">6</text>
    <text x="894" y="703" class="card-title">QC Validator</text>
    <text x="856" y="739" class="card-copy">Structure · CT · lengths · duplicates</text>
    <text x="856" y="765" class="card-copy">traceability · unresolved review states</text>
  </g>

  <!-- Output fanout -->
  <path d="M 828 724 H 760 V 843" class="connector"/>
  <path d="M 982 790 V 843" class="connector"/>
  <path d="M 1137 724 H 1212 V 843" class="connector"/>
  <path d="M 760 812 H 319 V 843" class="connector-dashed"/>
  <path d="M 1212 812 H 1435 V 843" class="connector-dashed"/>

  <!-- Deliverables -->
  <g class="stage s6">
    <text x="72" y="840" class="eyebrow" style="font-size:12px">REPRODUCIBLE DELIVERABLES</text>
    <g class="output-card">
      <rect x="72" y="863" width="285" height="116" rx="20" fill="url(#outputFill)" stroke="#31506d"/>
      <circle cx="105" cy="898" r="8" fill="#65b5ff"/><text x="124" y="904" class="card-title" style="font-size:17px">Study Facts</text>
      <text x="101" y="936" class="mono">study_facts.json</text><text x="101" y="958" class="card-copy">page + quote + status</text>
    </g>
    <g class="output-card">
      <rect x="378" y="863" width="285" height="116" rx="20" fill="url(#outputFill)" stroke="#31506d"/>
      <circle cx="411" cy="898" r="8" fill="#9c7cff"/><text x="430" y="904" class="card-title" style="font-size:17px">Decision Matrix</text>
      <text x="407" y="936" class="mono">parameter_decisions.json</text><text x="407" y="958" class="card-copy">rationale + rule provenance</text>
    </g>
    <g class="output-card">
      <rect x="684" y="863" width="285" height="116" rx="20" fill="url(#outputFill)" stroke="#3c746d"/>
      <circle cx="717" cy="898" r="8" fill="#46d9c5"/><text x="736" y="904" class="card-title" style="font-size:17px">TS Excel Draft</text>
      <text x="713" y="936" class="mono">trial_design_ts_draft.xlsx</text><text x="713" y="958" class="card-copy">approved records only</text>
    </g>
    <g class="output-card">
      <rect x="990" y="863" width="250" height="116" rx="20" fill="url(#outputFill)" stroke="#31506d"/>
      <circle cx="1023" cy="898" r="8" fill="#f6a84a"/><text x="1042" y="904" class="card-title" style="font-size:17px">QC Report</text>
      <text x="1019" y="936" class="mono">qc_report.xlsx</text><text x="1019" y="958" class="card-copy">actionable findings</text>
    </g>
    <g class="output-card">
      <rect x="1261" y="863" width="267" height="116" rx="20" fill="url(#outputFill)" stroke="#31506d"/>
      <circle cx="1294" cy="898" r="8" fill="#a8bfd3"/><text x="1313" y="904" class="card-title" style="font-size:17px">Run Manifest</text>
      <text x="1290" y="936" class="mono">run_manifest.json</text><text x="1290" y="958" class="card-copy">versions + hashes</text>
    </g>
  </g>

  <text x="1528" y="1022" text-anchor="end" class="mono">Draft decision support · qualified human review required</text>
</svg>

<svg viewBox="0 0 1600 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Historical v0.3 candidate workbook workflow</title>
  <desc id="desc">A private protocol PDF or public ClinicalTrials.gov record, or both, become one Study Facts structure. A lightweight TS Parameter Registry and pinned controlled terminology guide one reviewable Excel workbook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0b1d2e"/><stop offset="1" stop-color="#10243a"/></linearGradient>
    <linearGradient id="facts" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153c49"/><stop offset="1" stop-color="#122a40"/></linearGradient>
    <linearGradient id="excel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173c37"/><stop offset="1" stop-color="#122b35"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020711" flood-opacity=".45"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67819a"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#48d7c3"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eyebrow{font-size:14px;font-weight:750;letter-spacing:2.3px;fill:#48d7c3}.title{font-size:42px;font-weight:760;letter-spacing:-1.2px;fill:#f4f8fc}.subtitle{font-size:18px;fill:#a9bdd1}.card{fill:#10253a;stroke:#2c4862;stroke-width:1.5;filter:url(#shadow)}.card-title{font-size:21px;font-weight:720;fill:#f3f7fb}.copy{font-size:14px;fill:#a8bbcd}.small{font-size:12px;fill:#829bb1}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;fill:#8da6bb}.pill{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.step{font-size:14px;font-weight:800;fill:#061421;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#67819a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.accent{fill:none;stroke:#48d7c3;stroke-width:2.8;stroke-linecap:round;marker-end:url(#arrowA)}.dashed{fill:none;stroke:#67819a;stroke-width:1.8;stroke-dasharray:7 8;marker-end:url(#arrow)}
      .stage{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}.s1{animation-delay:.08s}.s2{animation-delay:.24s}.s3{animation-delay:.42s}.s4{animation-delay:.6s}.draw{stroke-dasharray:480;stroke-dashoffset:480;animation:draw 1.1s ease-out forwards}.d1{animation-delay:.38s}.d2{animation-delay:.58s}.d3{animation-delay:.78s}.pulse{animation:breathe 2.8s ease-in-out infinite;transform-origin:1418px 438px}.dot{filter:url(#glow)}
      @keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:.75;transform:scale(1.04)}}
      @media(prefers-reduced-motion:reduce){.stage,.draw,.pulse{animation:none!important;opacity:1;stroke-dashoffset:0}animateMotion,animate{display:none}}
    </style>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/><circle cx="1435" cy="-45" r="330" fill="#315b92" opacity=".08"/><circle cx="55" cy="920" r="290" fill="#28bda8" opacity=".06"/>

  <g class="stage s1">
    <text x="72" y="68" class="eyebrow">TRIAL DESIGN WORKFLOW · MINIMAL MVP</text>
    <text x="72" y="122" class="title">Two inputs. One path. One TS Excel.</text>
    <text x="72" y="158" class="subtitle">Protocol or NCT in → broad, traceable, programmer-reviewable Trial Summary draft out</text>
    <rect x="1275" y="67" width="253" height="66" rx="16" fill="#0d2135" stroke="#2c4862"/><circle cx="1305" cy="100" r="9" fill="#48d7c3"/>
    <text x="1327" y="96" class="copy" style="font-weight:700;fill:#dce8f2">TS Domain only</text><text x="1327" y="116" class="mono">small · reviewable · reproducible</text>
  </g>

  <g class="stage s1">
    <text x="72" y="220" class="eyebrow" style="font-size:12px">1 · INPUT — CHOOSE EITHER OR BOTH</text>
    <rect x="72" y="246" width="330" height="180" rx="24" class="card"/><circle cx="110" cy="284" r="18" fill="#65b5ff"/>
    <path d="M101 274h14l7 7v17h-21zM115 274v7h7" fill="none" stroke="#07111f" stroke-width="2" stroke-linejoin="round"/>
    <text x="143" y="290" class="card-title">Private Protocol</text><text x="102" y="330" class="copy">Local PDF · stays in the controlled environment</text>
    <rect x="102" y="351" width="268" height="29" rx="14.5" fill="#132f49"/><text x="236" y="366" class="pill" fill="#acd5ff">page + exact quote + file hash</text>
    <text x="102" y="406" class="small">Best source for planned study design</text>

    <rect x="72" y="454" width="330" height="180" rx="24" class="card"/><circle cx="110" cy="492" r="18" fill="#9c7cff"/>
    <path d="M101 492h18M110 483v18M103 486c5 4 9 8 14 13M117 486c-5 4-9 8-14 13" fill="none" stroke="#07111f" stroke-width="1.7" stroke-linecap="round"/>
    <text x="143" y="498" class="card-title">Public Registry</text><text x="102" y="538" class="copy">NCT ID · ClinicalTrials.gov API v2</text>
    <rect x="102" y="559" width="268" height="29" rx="14.5" fill="#2c294b"/><text x="236" y="574" class="pill" fill="#c9b8ff">JSON path + payload hash + time</text>
    <text x="102" y="614" class="small">Reproducible public demo and updates</text>
  </g>

  <path class="line draw d1" d="M402 336H470Q500 336 500 366V418Q500 438 528 438"/><path class="line draw d1" d="M402 544H470Q500 544 500 514V458Q500 438 528 438"/>
  <rect x="430" y="423" width="74" height="30" rx="15" fill="#0c1e30" stroke="#39536d"/><text x="467" y="439" class="pill" fill="#a8bbcd">OR / AND</text>

  <g class="stage s2">
    <rect x="528" y="276" width="400" height="324" rx="28" fill="url(#facts)" stroke="#3b6f79" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="570" cy="319" r="19" fill="#48d7c3"/><text x="570" y="319" class="step">2</text><text x="604" y="326" class="card-title" style="font-size:23px">Unified Study Facts</text>
    <text x="566" y="363" class="copy">Both adapters produce the same simple structure</text>
    <rect x="566" y="389" width="324" height="35" rx="9" fill="#0d2135"/><circle cx="583" cy="406.5" r="5" fill="#48d7c3"/><text x="598" y="411" class="mono">field · value · source · evidence</text>
    <rect x="566" y="433" width="324" height="35" rx="9" fill="#0d2135"/><circle cx="583" cy="450.5" r="5" fill="#48d7c3"/><text x="598" y="455" class="mono">status · confidence / review flag</text>
    <text x="566" y="507" class="small" style="font-weight:700;fill:#bcd0df">FIXED MERGE RULE</text>
    <rect x="566" y="521" width="96" height="29" rx="14.5" fill="#173e3a"/><text x="614" y="536" class="pill" fill="#70e2cc">AGREE</text>
    <rect x="671" y="521" width="105" height="29" rx="14.5" fill="#26394b"/><text x="723.5" y="536" class="pill" fill="#b4c7d8">ONE SOURCE</text>
    <rect x="785" y="521" width="105" height="29" rx="14.5" fill="#4a3623"/><text x="837.5" y="536" class="pill" fill="#ffc671">CONFLICT</text>
    <text x="566" y="579" class="small">Conflicts keep both values; nothing is silently overwritten.</text>
  </g>

  <path class="accent draw d2" d="M928 438H1010"/><circle r="4.5" fill="#48d7c3" class="dot"><animateMotion dur="3.2s" repeatCount="indefinite" path="M928 438H1010"/><animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/></circle>

  <g class="stage s3">
    <rect x="1010" y="276" width="310" height="324" rx="28" class="card"/><circle cx="1052" cy="319" r="19" fill="#f6a84a"/><text x="1052" y="319" class="step">3</text><text x="1086" y="326" class="card-title">TS Rules</text>
    <text x="1048" y="363" class="copy">One lightweight Parameter Registry</text>
    <rect x="1048" y="389" width="234" height="35" rx="9" fill="#142d45"/><text x="1165" y="407" class="pill" fill="#bcd0df">broad TSPARMCD candidates</text>
    <rect x="1048" y="433" width="234" height="35" rx="9" fill="#142d45"/><text x="1165" y="451" class="pill" fill="#bcd0df">applicability + source rule</text>
    <rect x="1048" y="477" width="234" height="35" rx="9" fill="#142d45"/><text x="1165" y="495" class="pill" fill="#bcd0df">pinned NCI CT lookup</text>
    <text x="1048" y="547" class="small" style="fill:#ffc671">Unknown stays unresolved.</text><text x="1048" y="571" class="small">Deterministic selection and mapping</text>
  </g>

  <path class="accent draw d3" d="M1320 438H1350"/>
  <g class="stage s4">
    <circle cx="1418" cy="438" r="132" fill="#48d7c3" opacity=".11" class="pulse"/>
    <rect x="1350" y="246" width="178" height="384" rx="28" fill="url(#excel)" stroke="#48d7c3" stroke-width="1.9" filter="url(#shadow)"/>
    <circle cx="1384" cy="283" r="19" fill="#48d7c3"/><text x="1384" y="283" class="step">4</text><text x="1377" y="330" class="card-title" style="font-size:20px">One Excel</text>
    <text x="1377" y="354" class="copy">broad · editable</text><text x="1377" y="375" class="copy">reviewable</text>
    <rect x="1377" y="402" width="124" height="55" rx="10" fill="#17443d"/><text x="1393" y="426" class="copy" style="font-weight:700;fill:#dff8f3">TS_Draft</text><text x="1393" y="445" class="small">standard columns</text>
    <rect x="1377" y="469" width="124" height="55" rx="10" fill="#18374a"/><text x="1393" y="493" class="copy" style="font-weight:700;fill:#dceaf5">Parameter_Review</text><text x="1393" y="512" class="small">keep / delete / fix</text>
    <rect x="1377" y="536" width="124" height="55" rx="10" fill="#3e3224"/><text x="1393" y="560" class="copy" style="font-weight:700;fill:#ffe0ad">Evidence_QC</text><text x="1393" y="579" class="small">source + CT + conflicts</text>
    <text x="1377" y="614" class="mono">ts_draft.xlsx</text>
  </g>

  <g class="stage s4">
    <rect x="248" y="714" width="1104" height="116" rx="24" fill="#0c1e30" stroke="#2c4862"/>
    <text x="282" y="750" class="eyebrow" style="font-size:12px">SMALL REPRODUCIBILITY RECORD — INTERNAL, NOT ANOTHER USER DELIVERABLE</text>
    <g transform="translate(282 772)">
      <rect width="160" height="32" rx="16" fill="#142d45"/><text x="80" y="17" class="pill" fill="#b7c9d9">input mode + NCT ID</text>
      <rect x="174" width="178" height="32" rx="16" fill="#142d45"/><text x="263" y="17" class="pill" fill="#b7c9d9">protocol / payload hash</text>
      <rect x="366" width="162" height="32" rx="16" fill="#142d45"/><text x="447" y="17" class="pill" fill="#b7c9d9">Registry version</text>
      <rect x="542" width="156" height="32" rx="16" fill="#142d45"/><text x="620" y="17" class="pill" fill="#b7c9d9">CT release</text>
      <rect x="712" width="174" height="32" rx="16" fill="#142d45"/><text x="799" y="17" class="pill" fill="#b7c9d9">software version + time</text>
    </g>
    <path d="M728 714V618" class="dashed"/><path d="M1240 714Q1438 687 1438 646" class="dashed"/>
  </g>

  <g class="stage s4">
    <rect x="72" y="865" width="1140" height="36" rx="18" fill="#102437"/><text x="92" y="888" class="copy" style="fill:#c2d2df">MVP boundary: TS only · no database · no web UI · no XPT · no Define-XML · no multi-layer approval engine</text>
    <text x="1528" y="889" text-anchor="end" class="mono">Decision support · qualified programmer review required</text>
  </g>
</svg>
